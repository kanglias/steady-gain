[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant"
version = "0.6.0"
description = "自用 A 股可视化量化工具。S6：周频均值回归研究轨"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.16.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "plotly>=5.22.0",
  "pyarrow>=15.0.0",
  "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29.0",
  "jupyterlab>=4.2.0",
  "nbclient>=0.10.0",
  "nbformat>=5.10.0",
  "pytest>=8.2.0",
]

[tool.setuptools]
packages = ["data", "strategy", "backtest", "viz", "orders", "journal"]

[tool.setuptools.package-data]
data = ["calendars/*"]
orders = ["banned.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
